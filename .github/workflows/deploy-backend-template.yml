on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy-template:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm ci --prefer-offline --no-audit || true

      - name: Build (no-op for simple server)
        run: |
          echo "No build step required for this repository."

      - name: Deploy placeholder
        run: |
          echo "This is a template. To enable real deployment, edit this workflow and add provider-specific steps."
          echo "Examples: use flyctl (requires FLY_API_TOKEN secret), or call Render API with RENDER_API_KEY."

